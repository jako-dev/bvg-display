; PlatformIO Project Configuration
; BVG Departure Display - ESP32 + HUB75 LED Matrix

; NOTE: the environment name must stay in sync with .github/workflows/build-firmware.yml,
; which builds `-e esp32dev` and picks up .pio/build/esp32dev/firmware.bin.
[env:esp32dev]
; Pinned for reproducible builds (arduino-esp32 2.0.x / ESP-IDF 4.4)
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    mrfaptastic/ESP32 HUB75 LED Matrix Panel DMA Display@^3.0.0
    bblanchon/ArduinoJson@^7.0.0
    ; Maintained fork of me-no-dev's async stack (that one is unmaintained and
    ; its registry name differs from the import name, which broke resolution).
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1

; Partition scheme with larger app space for web server
board_build.partitions = min_spiffs.csv
